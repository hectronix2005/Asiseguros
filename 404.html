<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Página no encontrada | AsiSeguros</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css?v=4">
  <style>
    .nf { min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 80px 20px; }
    .nf-inner { max-width: 560px; }
    .nf img { height: 55px; margin-bottom: 40px; }
    .nf-code { font-size: 4rem; font-weight: 800; color: var(--secondary); line-height: 1; margin-bottom: 8px; }
    .nf h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 14px; }
    .nf p { color: var(--gray-500); line-height: 1.7; margin-bottom: 32px; }
    .nf-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="nf">
    <div class="nf-inner">
      <img src="/assets/img/logo.png" alt="AsiSeguros">
      <div class="nf-code">404</div>
      <h1>Esta página no existe</h1>
      <p>
        Puede que el enlace esté desactualizado o que la página haya cambiado de
        dirección. Desde el inicio puedes ver todo el portafolio o escribirnos
        directamente.
      </p>
      <div class="nf-links">
        <a href="/" class="btn btn-primary"><i class="fas fa-house"></i> Ir al inicio</a>
        <a href="/#contacto" class="btn btn-outline"><i class="fas fa-file-signature"></i> Cotizar un seguro</a>
      </div>
    </div>
  </div>
</body>
</html>
